<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ZONOS3 voice cloning</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -70 304 304'%3E%3Crect x='-40' y='-70' width='304' height='304' rx='60' fill='%230a0a0a'/%3E%3Cpath d='M52 12L48 0L112 29L176 0L172.5 12L132 31.5C119.834 38.4119 115.001 47.0057 112 58C109.023 46.9907 103.919 38.5163 92 31.5L52 12Z M28 54L24 42L112 82L200 42L196 54L132 84.5C120.163 91.4503 114.998 99.9976 112 111C108.997 100.003 103.724 91.4982 92 84.5L28 54Z M0 84L112 135L224 84L220 96L132 137.5C121 144 115.007 153.012 112 164C109 153 103 143 92 137.5L4 96L0 84Z' fill='%23f5f3ee'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/lite-Cs7boy7I.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/web-engine-B4rZQJJM.js">
    <link rel="stylesheet" crossorigin href="/assets/lite-BkWJkRim.css">
  </head>
  <body>
    <main class="lite">
      <header>
        <h1>
          Voice cloning
          <span id="backend" class="badge" title="ZONOS3 runs in this tab on WebGPU; models are cached in the browser (Cache Storage)." hidden>In-browser</span>
        </h1>
        <p class="muted">Pick or clone a voice, then speak with its speaker embedding. <a id="studio-link" href="./">Full studio</a></p>
      </header>

      <p id="notice" class="notice" role="status" hidden></p>

      <section class="card" aria-labelledby="voice-heading">
        <h2 id="voice-heading">1. Voice</h2>
        <fieldset class="segmented">
          <legend class="sr-only">Voice source</legend>
          <input type="radio" name="source" id="source-default" value="default" checked />
          <label for="source-default">Default voice</label>
          <input type="radio" name="source" id="source-clip" value="clip" />
          <label for="source-clip">Clip</label>
          <input type="radio" name="source" id="source-embedding" value="embedding" />
          <label for="source-embedding">Embedding</label>
        </fieldset>

        <div id="panel-default" class="panel">
          <label for="voice-select">Voice</label>
          <select id="voice-select"></select>
        </div>

        <div id="panel-clip" class="panel" hidden>
          <label for="clip-file">Audio clip <span class="muted">(5–30 s of clean speech)</span></label>
          <input type="file" id="clip-file" accept="audio/*" />
          <div class="row">
            <button type="button" id="record" aria-pressed="false">Record</button>
            <span id="clip-state" class="muted" aria-live="polite"></span>
          </div>
          <label for="clip-label">Name</label>
          <input type="text" id="clip-label" autocomplete="off" placeholder="My voice" />
          <button type="button" id="clip-upload" class="primary" disabled>Clone voice</button>
        </div>

        <div id="panel-embedding" class="panel" hidden>
          <label for="embedding-file">Speaker embedding <span class="muted">(.npy or .npz)</span></label>
          <input type="file" id="embedding-file" accept=".npy,.npz" />
          <label for="embedding-label">Name</label>
          <input type="text" id="embedding-label" autocomplete="off" placeholder="My voice" />
          <button type="button" id="embedding-upload" class="primary" disabled>Load embedding</button>
        </div>

        <p id="voice-error" class="error" role="alert" hidden></p>

        <div id="voice" class="voice" hidden>
          <p><span class="muted">Selected:</span> <strong id="voice-label"></strong> <span id="voice-meta" class="muted"></span></p>
          <div class="row">
            <button type="button" id="preview">Play preview</button>
            <button type="button" id="download-embedding" class="link">Download embedding (.npy)</button>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="speak-heading">
        <h2 id="speak-heading">2. Speak</h2>
        <form id="generate-form">
          <label for="text">Text</label>
          <textarea id="text" rows="4" required>Hello! This is a cloned voice, speaking from its speaker embedding.</textarea>
          <div class="grid">
            <div>
              <label for="language">Language</label>
              <select id="language"></select>
            </div>
            <div>
              <label for="seed">Seed <span class="muted">(optional)</span></label>
              <input type="number" id="seed" min="0" max="4294967295" step="1" inputmode="numeric" placeholder="random" />
            </div>
          </div>
          <div class="row">
            <button type="submit" id="generate" class="primary">Generate</button>
            <button type="button" id="stop" hidden>Stop</button>
          </div>
        </form>
        <p id="generate-status" class="muted" role="status" aria-live="polite"></p>
        <p id="generate-error" class="error" role="alert" hidden></p>
        <div id="result" hidden>
          <audio id="result-audio" controls></audio>
          <div class="row">
            <a id="result-download" class="button" download>Download WAV</a>
            <span id="result-meta" class="muted"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
