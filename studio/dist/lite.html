<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Zyphra Voice Cloning</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -70 304 304'%3E%3Crect x='-40' y='-70' width='304' height='304' rx='60' fill='%230a0a0a'/%3E%3Cpath d='M52 12L48 0L112 29L176 0L172.5 12L132 31.5C119.834 38.4119 115.001 47.0057 112 58C109.023 46.9907 103.919 38.5163 92 31.5L52 12Z M28 54L24 42L112 82L200 42L196 54L132 84.5C120.163 91.4503 114.998 99.9976 112 111C108.997 100.003 103.724 91.4982 92 84.5L28 54Z M0 84L112 135L224 84L220 96L132 137.5C121 144 115.007 153.012 112 164C109 153 103 143 92 137.5L4 96L0 84Z' fill='%23f5f3ee'/%3E%3C/svg%3E" />
    <script>
      // The studio's saved theme before the first paint (no dark flash on the light theme).
      try {
        if (JSON.parse(localStorage.getItem('zvs.theme') || '"dark"') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <script type="module" crossorigin src="/assets/lite-CmD4yQ5-.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/marks-ByjfgAGY.js">
    <link rel="modulepreload" crossorigin href="/assets/latin-500-BwBaozd1.js">
    <link rel="modulepreload" crossorigin href="/assets/chrome-CMTZtdgD.js">
    <link rel="stylesheet" crossorigin href="/assets/marks-xKv10YAh.css">
    <link rel="stylesheet" crossorigin href="/assets/latin-500-DKfSw4PI.css">
    <link rel="stylesheet" crossorigin href="/assets/lite-Be9VkFbt.css">
  </head>
  <body>
    <header class="topbar">
      <a id="brand" class="brand" href="/" aria-label="Zyphra Voice">
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-product">Voice Cloning</span>
      </a>
      <div class="topbar-right">
        <span id="backend" class="pill" hidden><span class="pill-dot"></span><span class="pill-text"></span></span>
        <a id="studio-link" class="btn ghost sm" href="/studio">Full studio</a>
        <button type="button" id="theme" class="icon-btn"></button>
      </div>
    </header>

    <main class="lite">
      <header class="lite-head">
        <span class="eyebrow">Speaker embedding</span>
        <h1>Voice cloning</h1>
        <p class="muted">Pick or clone a voice, then speak with its speaker embedding.</p>
      </header>

      <p id="notice" class="notice" role="status" hidden></p>
      <div id="download" class="notice download" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="dl">
          <div class="dl-head"><span class="dl-label"></span><span class="dl-pct"></span></div>
          <div class="dl-track"><div class="dl-fill"></div></div>
          <span class="dl-detail"></span>
        </div>
      </div>

      <section class="panel" aria-labelledby="voice-heading">
        <div class="panel-head">
          <h3 id="voice-heading"><span class="step">1</span>Voice</h3>
          <fieldset class="mode">
            <legend class="sr-only">Voice source</legend>
            <input type="radio" name="source" id="source-default" value="default" checked />
            <label class="mode-btn" for="source-default">Default</label>
            <input type="radio" name="source" id="source-clip" value="clip" />
            <label class="mode-btn" for="source-clip">Clip</label>
            <input type="radio" name="source" id="source-embedding" value="embedding" />
            <label class="mode-btn" for="source-embedding">Embedding</label>
          </fieldset>
        </div>

        <div id="panel-default" class="source">
          <label class="field" for="voice-select">Voice</label>
          <select id="voice-select" class="input"></select>
        </div>

        <div id="panel-clip" class="source" hidden>
          <span class="field">Audio clip <span class="hint-inline">5–30 s of clean speech</span></span>
          <div class="row gap-s">
            <button type="button" id="clip-pick" class="btn" data-icon="upload">Upload</button>
            <button type="button" id="record" class="btn btn-rec" aria-pressed="false" data-icon="mic">Record</button>
            <span id="clip-state" class="hint-inline" aria-live="polite"></span>
            <input type="file" id="clip-file" accept="audio/*" hidden />
          </div>
          <label class="field" for="clip-label">Name</label>
          <div class="row gap-s nowrap">
            <input type="text" id="clip-label" class="input" autocomplete="off" placeholder="My voice" />
            <button type="button" id="clip-upload" class="btn primary" disabled>Clone voice</button>
          </div>
        </div>

        <div id="panel-embedding" class="source" hidden>
          <span class="field">Speaker embedding <span class="hint-inline">.npy or .npz</span></span>
          <div class="row gap-s">
            <button type="button" id="embedding-pick" class="btn" data-icon="upload">Choose file</button>
            <span id="embedding-state" class="hint-inline" aria-live="polite"></span>
            <input type="file" id="embedding-file" accept=".npy,.npz" hidden />
          </div>
          <label class="field" for="embedding-label">Name</label>
          <div class="row gap-s nowrap">
            <input type="text" id="embedding-label" class="input" autocomplete="off" placeholder="My voice" />
            <button type="button" id="embedding-upload" class="btn primary" disabled>Load embedding</button>
          </div>
        </div>

        <p id="voice-error" class="error-box" role="alert" hidden></p>

        <div id="voice" class="chosen" hidden>
          <div class="chosen-name">
            <span class="eyebrow">Selected</span>
            <strong id="voice-label"></strong>
            <span id="voice-meta" class="hint-inline"></span>
          </div>
          <div class="row gap-s">
            <button type="button" id="preview" class="btn sm" data-icon="play">Play preview</button>
            <button type="button" id="download-embedding" class="btn ghost sm" data-icon="download">Embedding (.npy)</button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="speak-heading">
        <div class="panel-head">
          <h3 id="speak-heading"><span class="step">2</span>Speak</h3>
        </div>
        <form id="generate-form">
          <label class="field" for="text">Text</label>
          <textarea id="text" class="input" rows="4" required>Hello! This is a cloned voice, speaking from its speaker embedding.</textarea>
          <div class="grid">
            <div>
              <label class="field" for="language">Language</label>
              <select id="language" class="input"></select>
            </div>
            <div>
              <label class="field" for="seed">Seed <span class="hint-inline">optional</span></label>
              <input type="number" id="seed" class="input" min="0" max="4294967295" step="1" inputmode="numeric" placeholder="random" />
            </div>
          </div>
          <div class="row gap-s actions">
            <button type="submit" id="generate" class="btn primary">Generate</button>
            <button type="button" id="stop" class="btn" data-icon="stop" hidden>Stop</button>
            <span id="generate-status" class="hint-inline" role="status" aria-live="polite"></span>
          </div>
        </form>
        <p id="generate-error" class="error-box" role="alert" hidden></p>
        <div id="result" class="result" hidden>
          <div id="wave" class="wave is-seekable" role="img" aria-label="Generated speech waveform" title="Click to play from here">
            <canvas></canvas>
            <div class="wave-head" hidden></div>
          </div>
          <div id="transport" class="row gap-s">
            <button type="button" id="play" class="icon-btn" aria-label="Play" title="Play"></button>
            <span id="result-meta" class="meta"></span>
            <a id="result-download" class="btn sm" download data-icon="download">Download WAV</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
