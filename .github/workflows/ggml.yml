name: ggml

# The ggml server (servers/ggml). Release tags: ggml-v*.
on:
  push:
    branches: [main]
    tags: ['ggml-v*']
    paths:
      - "servers/ggml/**"
      - "servers/api/openapi.json"
      - "studio/dist/**"
      - "assets/default_voices/**"
      - "assets/laci_heads/**"
      - "model/src/zonos3/**"
      - "third_party/zyphra-textnorm"
      - "third_party/fusealign-multilingual"
      - ".github/workflows/ggml.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "servers/ggml/**"
      - "servers/api/openapi.json"
      - "studio/dist/**"
      - "assets/default_voices/**"
      - "assets/laci_heads/**"
      - "model/src/zonos3/**"
      - "third_party/zyphra-textnorm"
      - "third_party/fusealign-multilingual"
      - ".github/workflows/ggml.yml"
      - ".gitmodules"

# Allow the release job to create a GitHub Release on version tags.
permissions:
  contents: write

defaults:
  run:
    working-directory: servers/ggml

jobs:
  # ---------------------------------------------------------------- Linux CPU
  linux-cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Not recursive: fusealign-multilingual's own ggml submodule is not needed (packages ship its Python package).
      - name: Fetch the submodules
        working-directory: .
        run: git submodule update --init servers/ggml/ggml third_party/fusealign-multilingual third_party/zyphra-textnorm
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-cpu
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servers/ggml/build/textnorm
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('third_party/zyphra-textnorm/Cargo.lock', 'third_party/zyphra-textnorm/src/**', 'third_party/zyphra-textnorm/data/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos3-cli -o -name zonos3-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos3-server -o -name zonos3-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, small random weights,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos3.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
          encoder=$(find build \( -name zac-encoder-cli -o -name zac-encoder-cli.exe \) -type f | head -1)
          test -n "$encoder" || { echo "ZAC encoder companion tool not built"; exit 1; }
          out=$("$encoder" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "encoder smoke failed:"; echo "$out"; exit 1; }
          teacher=$(find build \( -name ssl-encoder-cli -o -name ssl-encoder-cli.exe \) -type f | head -1)
          test -n "$teacher" || { echo "SSL teacher companion tool not built"; exit 1; }
          out=$("$teacher" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "teacher smoke failed:"; echo "$out"; exit 1; }
          speaker=$(find build \( -name spk-encoder-cli -o -name spk-encoder-cli.exe \) -type f | head -1)
          test -n "$speaker" || { echo "speaker encoder companion tool not built"; exit 1; }
          out=$("$speaker" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "speaker smoke failed:"; echo "$out"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + ZAC): the CLI codes/WAV paths on every platform,
      # plus the zonos3-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      - name: Tokenizer test
        shell: bash
        run: bash tests/tokenizer.sh
      # Exercise the local-GGUF launcher, ffmpeg fetch, and server teardown.
      - name: Launcher smoke test
        shell: bash
        run: bash tests/launcher-smoke.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos3-cli' -o -name 'zac-encoder-cli' -o -name 'ssl-encoder-cli' -o -name 'spk-encoder-cli' -o -name 'zac-cli' -o -name 'quantize-cli' -o -name 'zonos3-server' \) -type f -exec cp {} dist/ \;
          cp -r ../../studio/dist dist/studio
          cp -r ../../assets/default_voices dist/
          cp -r ../../assets/laci_heads dist/
          mkdir -p dist/python
          cp -r ../../model/src/zonos3 dist/python/zonos3
          cp -r ../../third_party/fusealign-multilingual/fusealign_hub dist/python/fusealign_hub
          cp ../../third_party/fusealign-multilingual/LICENSE dist/python/fusealign_hub/LICENSE
          cp -r ../../LICENSE ../../NOTICE dist/ && mkdir -p dist/third_party && cp -r ../../third_party/licenses dist/third_party/
          cp scripts/start-zonos3.sh dist/start-zonos3.sh
          chmod +x dist/start-zonos3.sh
          tar -C dist -czf zonos3-linux-x64-cpu.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-linux-x64-cpu
          path: servers/ggml/zonos3-linux-x64-cpu.tar.gz

  # ------------------------------------------------------------- Linux Vulkan
  linux-vulkan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules
        working-directory: .
        run: git submodule update --init servers/ggml/ggml third_party/fusealign-multilingual third_party/zyphra-textnorm
      - name: Install Vulkan SDK (LunarG)
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Resolve ggml submodule rev
        id: ggml
        run: echo "sha=$(git rev-parse HEAD:./ggml)" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-vulkan
      # Shader gen (glslc) is the build's long pole and ccache does not cover it;
      # the generated SPIR-V depends only on the ggml submodule. Same approach as
      # the windows-vulkan job.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: servers/ggml/build
          key: linux-vulkan-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('servers/ggml/src/**', 'servers/ggml/CMakeLists.txt') }}
          restore-keys: |
            linux-vulkan-build-${{ steps.ggml.outputs.sha }}-
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servers/ggml/build/textnorm
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('third_party/zyphra-textnorm/Cargo.lock', 'third_party/zyphra-textnorm/src/**', 'third_party/zyphra-textnorm/data/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos3-cli -o -name zonos3-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos3-server -o -name zonos3-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, small random weights,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos3.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
          encoder=$(find build \( -name zac-encoder-cli -o -name zac-encoder-cli.exe \) -type f | head -1)
          test -n "$encoder" || { echo "ZAC encoder companion tool not built"; exit 1; }
          out=$("$encoder" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "encoder smoke failed:"; echo "$out"; exit 1; }
          teacher=$(find build \( -name ssl-encoder-cli -o -name ssl-encoder-cli.exe \) -type f | head -1)
          test -n "$teacher" || { echo "SSL teacher companion tool not built"; exit 1; }
          out=$("$teacher" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "teacher smoke failed:"; echo "$out"; exit 1; }
          speaker=$(find build \( -name spk-encoder-cli -o -name spk-encoder-cli.exe \) -type f | head -1)
          test -n "$speaker" || { echo "speaker encoder companion tool not built"; exit 1; }
          out=$("$speaker" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "speaker smoke failed:"; echo "$out"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + ZAC): the CLI codes/WAV paths on every platform,
      # plus the zonos3-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      - name: Tokenizer test
        shell: bash
        run: bash tests/tokenizer.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos3-cli' -o -name 'zac-encoder-cli' -o -name 'ssl-encoder-cli' -o -name 'spk-encoder-cli' -o -name 'zac-cli' -o -name 'quantize-cli' -o -name 'zonos3-server' \) -type f -exec cp {} dist/ \;
          cp -r ../../studio/dist dist/studio
          cp -r ../../assets/default_voices dist/
          cp -r ../../assets/laci_heads dist/
          mkdir -p dist/python
          cp -r ../../model/src/zonos3 dist/python/zonos3
          cp -r ../../third_party/fusealign-multilingual/fusealign_hub dist/python/fusealign_hub
          cp ../../third_party/fusealign-multilingual/LICENSE dist/python/fusealign_hub/LICENSE
          cp -r ../../LICENSE ../../NOTICE dist/ && mkdir -p dist/third_party && cp -r ../../third_party/licenses dist/third_party/
          # stamp the launcher's backend default to match this archive's build
          sed 's/^GPU_DEFAULT=cpu/GPU_DEFAULT=gpu/' scripts/start-zonos3.sh > dist/start-zonos3.sh
          grep -q '^GPU_DEFAULT=gpu' dist/start-zonos3.sh || { echo "GPU stamp failed"; exit 1; }
          chmod +x dist/start-zonos3.sh
          tar -C dist -czf zonos3-linux-x64-vulkan.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-linux-x64-vulkan
          path: servers/ggml/zonos3-linux-x64-vulkan.tar.gz

  # -------------------------------------------------------- Linux desktop app
  # zonos3-app (saucer webview shell). Needs ubuntu-24.04: saucer hard-requires
  # GTK4 >= 4.12 + a C++23 compiler (gcc-14), both beyond the 22.04 jobs above,
  # which stay on 22.04 to keep the glibc baseline of the CLI artifacts.
  linux-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules
        working-directory: .
        run: git submodule update --init servers/ggml/ggml third_party/fusealign-multilingual third_party/zyphra-textnorm
      - name: Install desktop + Vulkan deps
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk gcc-14 g++-14 \
            libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev libjson-glib-dev
      - name: Resolve ggml submodule rev
        id: ggml
        run: echo "sha=$(git rev-parse HEAD:./ggml)" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-app
      # Same shader-gen build-tree cache rationale as the linux-vulkan job.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: servers/ggml/build
          key: linux-app-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('servers/ggml/src/**', 'servers/ggml/CMakeLists.txt') }}
          restore-keys: |
            linux-app-build-${{ steps.ggml.outputs.sha }}-
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servers/ggml/build/textnorm
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('third_party/zyphra-textnorm/Cargo.lock', 'third_party/zyphra-textnorm/src/**', 'third_party/zyphra-textnorm/data/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DZONOS3_APP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos3-app -type f | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
      - name: Package
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        shell: bash
        run: |
          mkdir -p dist
          find build -name 'zonos3-app' -type f -exec cp {} dist/ \;
          cp -r ../../studio/dist dist/studio
          cp assets/app/zonos3.desktop assets/app/zonos3.png dist/
          cp -r ../../assets/default_voices dist/
          cp -r ../../assets/laci_heads dist/
          mkdir -p dist/python
          cp -r ../../model/src/zonos3 dist/python/zonos3
          cp -r ../../third_party/fusealign-multilingual/fusealign_hub dist/python/fusealign_hub
          cp ../../third_party/fusealign-multilingual/LICENSE dist/python/fusealign_hub/LICENSE
          cp -r ../../LICENSE ../../NOTICE dist/ && mkdir -p dist/third_party && cp -r ../../third_party/licenses dist/third_party/
          tar -C dist -czf zonos3-linux-x64-app.tar.gz .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-linux-x64-app
          path: servers/ggml/zonos3-linux-x64-app.tar.gz

  # ------------------------------------------------------------- macOS Metal
  # macos-15 is Apple Silicon (arm64); Metal is enabled by default in ggml.
  # (15 rather than 14 because zonos3-app's saucer dependency needs AppleClang 17
  # / Xcode >= 16.3.)
  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules
        working-directory: .
        run: git submodule update --init servers/ggml/ggml third_party/fusealign-multilingual third_party/zyphra-textnorm
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-metal
      - name: Select Xcode >= 16.3 (saucer needs AppleClang 17)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16.*.app /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer"
          clang++ --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servers/ggml/build/textnorm
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('third_party/zyphra-textnorm/Cargo.lock', 'third_party/zyphra-textnorm/src/**', 'third_party/zyphra-textnorm/data/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DZONOS3_APP=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: App smoke test
        shell: bash
        run: |
          bin=$(find build -path '*Zonos3.app/Contents/MacOS/*' -type f -perm +111 | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build \( -name zonos3-cli -o -name zonos3-cli.exe \) -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build \( -name zonos3-server -o -name zonos3-server.exe \) -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, small random weights,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos3.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
          encoder=$(find build \( -name zac-encoder-cli -o -name zac-encoder-cli.exe \) -type f | head -1)
          test -n "$encoder" || { echo "ZAC encoder companion tool not built"; exit 1; }
          out=$("$encoder" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "encoder smoke failed:"; echo "$out"; exit 1; }
          teacher=$(find build \( -name ssl-encoder-cli -o -name ssl-encoder-cli.exe \) -type f | head -1)
          test -n "$teacher" || { echo "SSL teacher companion tool not built"; exit 1; }
          out=$("$teacher" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "teacher smoke failed:"; echo "$out"; exit 1; }
          speaker=$(find build \( -name spk-encoder-cli -o -name spk-encoder-cli.exe \) -type f | head -1)
          test -n "$speaker" || { echo "speaker encoder companion tool not built"; exit 1; }
          out=$("$speaker" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "speaker smoke failed:"; echo "$out"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + ZAC): the CLI codes/WAV paths on every platform,
      # plus the zonos3-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      - name: Tokenizer test
        shell: bash
        run: bash tests/tokenizer.sh
      # Exercise the end-user launcher (local models + ffmpeg fetch + serve + teardown)
      # against the dummy fixtures and a local ffmpeg download server.
      - name: Launcher smoke test
        shell: bash
        run: bash tests/launcher-smoke.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos3-cli' -o -name 'zac-encoder-cli' -o -name 'ssl-encoder-cli' -o -name 'spk-encoder-cli' -o -name 'zac-cli' -o -name 'quantize-cli' -o -name 'zonos3-server' \) -type f -exec cp {} dist/ \;
          cp -r ../../studio/dist dist/studio
          cp -r ../../assets/default_voices dist/
          cp -r ../../assets/laci_heads dist/
          mkdir -p dist/python
          cp -r ../../model/src/zonos3 dist/python/zonos3
          cp -r ../../third_party/fusealign-multilingual/fusealign_hub dist/python/fusealign_hub
          cp ../../third_party/fusealign-multilingual/LICENSE dist/python/fusealign_hub/LICENSE
          cp -r ../../LICENSE ../../NOTICE dist/ && mkdir -p dist/third_party && cp -r ../../third_party/licenses dist/third_party/
          # stamp the launcher's backend default to match this archive's build;
          # ship it twice: .command for Finder double-click, .sh for the terminal
          sed 's/^GPU_DEFAULT=cpu/GPU_DEFAULT=gpu/' scripts/start-zonos3.sh > dist/start-zonos3.sh
          grep -q '^GPU_DEFAULT=gpu' dist/start-zonos3.sh || { echo "GPU stamp failed"; exit 1; }
          cp dist/start-zonos3.sh dist/start-zonos3.command
          chmod +x dist/start-zonos3.sh dist/start-zonos3.command
          tar -C dist -czf zonos3-macos-arm64-metal.tar.gz .
          # Desktop app bundle, ad-hoc signed (users right-click > Open past Gatekeeper).
          app=$(find build -name 'Zonos3.app' -type d | head -1)
          codesign --force --deep -s - "$app"
          ditto -c -k --keepParent "$app" zonos3-macos-arm64-app.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-macos-arm64-metal
          path: servers/ggml/zonos3-macos-arm64-metal.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-macos-arm64-app
          path: servers/ggml/zonos3-macos-arm64-app.zip

  # ----------------------------------------------------------- Windows Vulkan
  # MSVC build; relies on the _WIN32 file-IO shim in src/compat.h.
  windows-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules
        working-directory: .
        run: git submodule update --init servers/ggml/ggml third_party/fusealign-multilingual third_party/zyphra-textnorm
      - name: Prepare Windows launchers
        shell: bash
        run: |
          mkdir -p dist
          # sed preserves the UTF-8 BOM required by Windows PowerShell 5.1.
          # Prepare on every run so PRs test the launcher shipped in releases.
          sed "s/^\\\$GPU_DEFAULT = 'cpu'/\$GPU_DEFAULT = 'gpu'/" scripts/start-zonos3.ps1 > dist/start-zonos3.ps1
          grep -q "^\\\$GPU_DEFAULT = 'gpu'" dist/start-zonos3.ps1 || { echo "GPU stamp failed"; exit 1; }
          cp scripts/start-zonos3.bat dist/start-zonos3.bat
      - name: Launcher regression tests (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows-launcher.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell launcher regression tests failed" }
      - name: Launcher regression tests (PowerShell 7)
        shell: pwsh
        run: .\tests\windows-launcher.ps1
      # Ninja needs cl.exe on PATH (the VS generator found it implicitly).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Resolve ggml submodule rev
        id: ggml
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:./ggml)" >> "$GITHUB_OUTPUT"
      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.313.2
          key: vulkan-sdk-1.4.313.2
      - name: Install Vulkan SDK (LunarG)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # 1.4.313.2 bundles the SPIRV-Headers CMake config that ggml-vulkan
          # requires via find_package(SPIRV-Headers CONFIG). Note the 1.4.x Windows
          # installer is named vulkansdk-windows-X64-<ver>.exe; the legacy
          # VulkanSDK-<ver>-Installer.exe name only exists for <=1.3.x.
          $ver = "1.4.313.2"
          curl.exe -L -o VulkanSDK.exe "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          if ((Get-Item VulkanSDK.exe).Length -lt 50MB) { throw "Vulkan SDK download failed: got $((Get-Item VulkanSDK.exe).Length) bytes" }
          .\VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
      - name: Set Vulkan SDK env
        shell: pwsh
        run: |
          $ver = "1.4.313.2"
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-vulkan
      # The generated SPIR-V shaders (the build's long pole) depend only on the ggml
      # submodule, so key the build tree on its rev. restore-keys lets a src-only
      # change reuse the cached shaders + unchanged objects and rebuild just the
      # changed C++; the restored .spv are newer than the checked-out .comp, so the
      # shader-gen step is a no-op.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: servers/ggml/build
          key: win-vulkan-build-${{ steps.ggml.outputs.sha }}-${{ hashFiles('servers/ggml/src/**', 'servers/ggml/CMakeLists.txt') }}
          restore-keys: |
            win-vulkan-build-${{ steps.ggml.outputs.sha }}-
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servers/ggml/build/textnorm
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('third_party/zyphra-textnorm/Cargo.lock', 'third_party/zyphra-textnorm/src/**', 'third_party/zyphra-textnorm/data/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZONOS3_APP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j
      - name: Build voice-cloning regression tests
        run: cmake --build build --target fake-ffmpeg ffmpeg-decode-smoke -j
      - name: Windows ffmpeg process-launch test
        shell: pwsh
        run: |
          $fake = Get-ChildItem build -Recurse -Filter fake-ffmpeg.exe | Select-Object -First 1
          $smoke = Get-ChildItem build -Recurse -Filter ffmpeg-decode-smoke.exe | Select-Object -First 1
          if (-not $fake -or -not $smoke) { throw "voice-cloning test binaries not found" }

          $testDir = Join-Path $env:RUNNER_TEMP 'zonos3 ffmpeg % & smoke'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $input = Join-Path $testDir 'reference voice % &.wav'
          [System.IO.File]::WriteAllText($input, 'fake audio input')

          # The packaged launcher sets an absolute executable path. Both that path
          # and the uploaded audio path deliberately contain cmd.exe metacharacters.
          $envFfmpeg = Join-Path $testDir 'ffmpeg % & helper.exe'
          Copy-Item $fake.FullName $envFfmpeg
          $env:ZONOS3_FFMPEG = $envFfmpeg
          & $smoke.FullName $input
          if ($LASTEXITCODE -ne 0) { throw "ZONOS3_FFMPEG launch test failed" }

          # The standalone CLI also promises to discover a system ffmpeg on PATH.
          $pathDir = Join-Path $testDir 'path fallback'
          New-Item -ItemType Directory -Force -Path $pathDir | Out-Null
          Copy-Item $fake.FullName (Join-Path $pathDir 'ffmpeg.exe')
          Remove-Item Env:ZONOS3_FFMPEG
          $env:PATH = "$pathDir;$env:PATH"
          & $smoke.FullName $input
          if ($LASTEXITCODE -ne 0) { throw "PATH ffmpeg launch test failed" }
      - name: App smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos3-app.exe -type f | head -1)
          out=$("$bin" --help 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "app smoke failed:"; echo "$out"; exit 1; }
      - name: Smoke test
        shell: bash
        run: |
          bin=$(find build -name zonos3-cli.exe -type f | head -1)
          out=$("$bin" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "smoke failed:"; echo "$out"; exit 1; }
          srv=$(find build -name zonos3-server.exe -type f | head -1)
          out=$("$srv" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "server smoke failed:"; echo "$out"; exit 1; }
          # End-to-end forward pass on a tiny committed model (random weights, small random weights,
          # see scripts/make-dummy-model.py): exercises prompt build -> backbone graph ->
          # sampler on the CPU backend, the path the usage check never reaches. Audio is
          # gibberish by design — we only assert the decode loop runs and emits codes.
          out=$("$bin" tests/fixtures/dummy-zonos3.gguf --tts "ci smoke test" gen.npy --max 8 --greedy 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then echo "dummy-model run failed (rc=$rc):"; echo "$out"; exit 1; fi
          echo "$out" | grep -qE "tts: [0-9]+ frames, eos_frame=" || { echo "dummy-model: no generation output"; echo "$out"; exit 1; }
          test -f gen.npy || { echo "dummy-model: no output file written"; exit 1; }
          encoder=$(find build \( -name zac-encoder-cli -o -name zac-encoder-cli.exe \) -type f | head -1)
          test -n "$encoder" || { echo "ZAC encoder companion tool not built"; exit 1; }
          out=$("$encoder" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "encoder smoke failed:"; echo "$out"; exit 1; }
          teacher=$(find build \( -name ssl-encoder-cli -o -name ssl-encoder-cli.exe \) -type f | head -1)
          test -n "$teacher" || { echo "SSL teacher companion tool not built"; exit 1; }
          out=$("$teacher" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "teacher smoke failed:"; echo "$out"; exit 1; }
          speaker=$(find build \( -name spk-encoder-cli -o -name spk-encoder-cli.exe \) -type f | head -1)
          test -n "$speaker" || { echo "speaker encoder companion tool not built"; exit 1; }
          out=$("$speaker" 2>&1 || true)
          echo "$out" | grep -q "usage:" || { echo "speaker smoke failed:"; echo "$out"; exit 1; }
      # Run the documented README / docs/INTERNALS.md commands against the committed
      # dummy fixtures (backbone + ZAC): the CLI codes/WAV paths on every platform,
      # plus the zonos3-server HTTP routes on Linux/macOS (the script self-skips the
      # server on Windows and when curl is absent).
      - name: README command tests
        shell: bash
        run: bash tests/readme-commands.sh
      - name: Tokenizer test
        shell: bash
        run: bash tests/tokenizer.sh
      - name: Package
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        shell: bash
        run: |
          mkdir -p dist
          find build \( -name 'zonos3-cli.exe' -o -name 'zac-encoder-cli.exe' -o -name 'ssl-encoder-cli.exe' -o -name 'spk-encoder-cli.exe' -o -name 'zac-cli.exe' -o -name 'quantize-cli.exe' -o -name 'zonos3-server.exe' -o -name 'zonos3-app.exe' \) -type f -exec cp {} dist/ \;
          cp -r ../../studio/dist dist/studio
          cp -r ../../assets/default_voices dist/
          cp -r ../../assets/laci_heads dist/
          mkdir -p dist/python
          cp -r ../../model/src/zonos3 dist/python/zonos3
          cp -r ../../third_party/fusealign-multilingual/fusealign_hub dist/python/fusealign_hub
          cp ../../third_party/fusealign-multilingual/LICENSE dist/python/fusealign_hub/LICENSE
          cp -r ../../LICENSE ../../NOTICE dist/ && mkdir -p dist/third_party && cp -r ../../third_party/licenses dist/third_party/
          # dist already contains the BOM-preserving, regression-tested launchers.
          # zip, not tar.gz: Explorer extracts it natively and (unlike tar) keeps
          # the Mark-of-the-Web flow the README's SmartScreen guidance describes
          (cd dist && 7z a -tzip ../zonos3-windows-x64-vulkan.zip . > /dev/null)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/ggml-v')
        with:
          name: zonos3-windows-x64-vulkan
          path: servers/ggml/zonos3-windows-x64-vulkan.zip

  # ------------------------------------------------- Release (version tags only)
  release:
    needs: [linux-cpu, linux-vulkan, linux-app, macos-metal, windows-vulkan]
    if: startsWith(github.ref, 'refs/tags/ggml-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Release-candidate tags (ggml-v0.5.0-rc1, ...) are prereleases, so they don't show as "Latest".
          prerelease: ${{ contains(github.ref_name, '-rc') }}
