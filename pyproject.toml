# Virtual uv workspace: the model package (zonos3), the mini-SGL server (zonos3-sgl), the MLX server (zonos3-mlx), the
# GGUF tools and the API conformance suite. The ggml server (servers/ggml) and the studio (studio/) build outside uv.

[tool.uv.workspace]
members = ["model", "servers/sgl", "servers/mlx", "tools", "api"]

[tool.uv]
# tilelang 0.1.14 declares apache-tvm-ffi>=0.1.11,<0.1.13; the qualified runtime runs it against 0.1.8.post2.
override-dependencies = ["apache-tvm-ffi==0.1.8.post2"]

[tool.uv.sources]
flashinfer-jit-cache = { url = "https://github.com/flashinfer-ai/flashinfer/releases/download/v0.5.3/flashinfer_jit_cache-0.5.3+cu128-cp39-abi3-manylinux_2_28_x86_64.whl" }
zonos3 = { workspace = true }
zonos3-sgl = { workspace = true }
zonos3-mlx = { workspace = true }
fusealign-hub = { path = "third_party/fusealign-multilingual", editable = true }

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pre-commit>=3.0.0",
    "ruff>=0.11.0",
    "matplotlib>=3.10.5",
]
# Opt-in: espeak-ng guesses pronunciations the gold lexicon lacks (/v2/phonemize).
# espeak-ng is GPL-3.0, so it stays out of the default install.
phonemize = [
    "espeakng-loader>=0.2.4",
]

[tool.pytest.ini_options]
testpaths = ["model/tests", "servers/sgl/tests", "servers/mlx/tests", "tools/tests", "api/tests/test_spec.py"]
pythonpath = ["tools"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=zonos3",
    "--cov=zonos3_sgl",
    "--cov=zonos3_mlx",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "gpu: test loads model weights and requires a GPU (set ZONOS3_TEST_MODEL to run)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "model/src/zonos3/vendor",
    "model/src/zonos3/models/third_party",
    "third_party",
    "servers/ggml/ggml",
    "servers/ggml/vendor",
    ".avsync",
]
lint.select = [
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
]
