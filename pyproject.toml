# Virtual uv workspace: the model package (zonos3), the mini-SGL server (zonos3-sgl), the GGUF tools and the API
# conformance suite. The ggml server (servers/ggml) and the studio (studio/) build outside uv.

[tool.uv.workspace]
members = ["model", "servers/sgl", "tools", "api"]

[tool.uv]
# tilelang 0.1.14 declares apache-tvm-ffi>=0.1.11,<0.1.13; the qualified runtime runs it against 0.1.8.post2.
override-dependencies = ["apache-tvm-ffi==0.1.8.post2"]

[tool.uv.sources]
flashinfer-jit-cache = { url = "https://github.com/flashinfer-ai/flashinfer/releases/download/v0.5.3/flashinfer_jit_cache-0.5.3+cu128-cp39-abi3-manylinux_2_28_x86_64.whl" }
zonos3 = { workspace = true }
zonos3-sgl = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "pre-commit>=3.0.0",
    "ruff>=0.11.0",
    "matplotlib>=3.10.5",
]
# Opt-in: espeak-ng guesses pronunciations the gold lexicon lacks (/tts/phonemize).
# espeak-ng is GPL-3.0, so it stays out of the default install.
phonemize = [
    "espeakng-loader>=0.2.4",
]

[tool.pytest.ini_options]
testpaths = ["model/tests", "servers/sgl/tests", "tools/tests", "api/tests/test_spec.py"]
pythonpath = ["tools"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=zonos3",
    "--cov=zonos3_sgl",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "gpu: test loads model weights and requires a GPU (set ZONOS3_TEST_MODEL to run)",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = [
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
]
lint.ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "datasets.*",
]
ignore_missing_imports = true
